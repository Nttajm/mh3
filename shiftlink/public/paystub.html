<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiftLink · Pay Stub</title>
    <link rel="stylesheet" href="/shared/styles.css" />
    <style>
      body {
        background: #eef0f4;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .stub {
        width: 420px;
        max-width: 100%;
        background: white;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }
      .head {
        background: linear-gradient(135deg, #0a84ff, #34c759);
        color: white;
        padding: 24px;
      }
      .head .brand {
        font-weight: 700;
        font-size: 14px;
        opacity: 0.9;
        letter-spacing: 0.05em;
      }
      .head h1 {
        margin: 6px 0 0;
        font-size: 22px;
      }
      .body {
        padding: 24px;
      }
      .total {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .total small {
        font-size: 16px;
        font-weight: 600;
        color: #8e8e93;
      }
      .rows {
        margin-top: 18px;
        border-top: 1px solid #ececf0;
      }
      .r {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #ececf0;
        font-size: 15px;
      }
      .r .k {
        color: #8e8e93;
      }
      .r .v {
        font-weight: 600;
      }
      .note {
        margin-top: 18px;
        background: #f1f7ff;
        border-radius: 12px;
        padding: 14px;
        font-size: 13px;
        color: #2b5278;
        line-height: 1.5;
      }
      .verified {
        margin-top: 16px;
        font-size: 12px;
        color: #34c759;
        font-weight: 600;
      }
      .err {
        padding: 40px 24px;
        text-align: center;
        color: #8e8e93;
      }
    </style>
  </head>
  <body>
    <div class="stub" id="stub">
      <div class="err">Loading pay stub…</div>
    </div>

    <script type="module">
      import { db, isConfigured, doc, getDoc } from "/shared/firebase.js";

      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const el = document.getElementById("stub");

      function render(s) {
        el.innerHTML = `
          <div class="head">
            <div class="brand">SHIFTLINK · DIGITAL PAY STUB</div>
            <h1>${s.jobTitle || "Completed shift"}</h1>
          </div>
          <div class="body">
            <div class="total">$${s.total} <small>earned</small></div>
            <div class="rows">
              <div class="r"><span class="k">Employer</span><span class="v">${s.employerName || "—"}</span></div>
              <div class="r"><span class="k">Date</span><span class="v">${s.date || "—"}</span></div>
              <div class="r"><span class="k">Hours</span><span class="v">${s.hours}</span></div>
              <div class="r"><span class="k">Rate</span><span class="v">$${s.rate}/hr</span></div>
            </div>
            <div class="note">
              This record can be used as proof of income for housing or services. Day-labor work
              normally leaves no paper trail — ShiftLink keeps one for you.
            </div>
            <div class="verified">✓ Verified by ShiftLink</div>
          </div>`;
      }

      async function load() {
        if (!isConfigured || !db) {
          el.innerHTML = '<div class="err">Firebase isn\'t configured, so this stub can\'t load.</div>';
          return;
        }
        if (!id) {
          el.innerHTML = '<div class="err">No pay stub id provided.</div>';
          return;
        }
        const snap = await getDoc(doc(db, "paystubs", id));
        if (!snap.exists()) {
          el.innerHTML = '<div class="err">Pay stub not found.</div>';
          return;
        }
        render(snap.data());
      }

      load();
    </script>
  </body>
</html>
